 const setTouch=on=>{document.documentElement.classList.toggle('touch',on);document.querySelectorAll('.ctog').forEach(b=>b.textContent=on?'🎮 Touch controls: ON':'⌨ Touch controls: OFF');document.querySelectorAll('.keys').forEach(e=>e.innerHTML=(on?KEYS_T:KEYS_D).map(k=>`<div><kbd>${k[0]}</kbd>${k[1]}</div>`).join(''));resize()};
 document.querySelectorAll('.set').forEach(e=>{const b=document.createElement('button');b.className='s ctog';b.onclick=()=>setTouch(!document.documentElement.classList.contains('touch'));e.appendChild(b)});
 setTouch(document.documentElement.classList.contains('touch'));
 addEventListener('pointerdown',e=>{if(e.pointerType=='touch'&&!document.documentElement.classList.contains('touch'))setTouch(true)},true)}

setQ(IS_TOUCH?'low':'high');resize();loop(performance.now());
})();
</script></body></html>
